name: Daily Prisjakt refresh

on:
  schedule:
    # GitHub Actions cron uses UTC. 00:00 UTC is 08:00 in Beijing (UTC+8).
    - cron: '0 0 * * *'
    # Refresh up to eight products per run from 08:07 to 23:57 Beijing.
    # Extra slots absorb delayed or dropped GitHub scheduled events.
    - cron: '7,17,27,37,47,57 0-15 * * *'
  workflow_dispatch:

concurrency:
  group: pricedesk-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refresh the next eight products
        env:
          PRICE_DESK_URL: ${{ vars.PRICE_DESK_URL }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PRICE_DESK_URL?.replace(/\/$/, '');
          if (!base) throw new Error('Set the PRICE_DESK_URL repository variable first.');
          const beijingDay = (value) => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
          }).format(new Date(value));
          const today = beijingDay(Date.now());
          const countries = ['SE', 'DK', 'FI', 'NO'];
          const staleCountries = (product) => countries.filter((country) => {
            const refreshedAt = product.markets?.[country]?.autoRefreshedAt;
            return !refreshedAt || beijingDay(refreshedAt) !== today;
          });
          const initial = await fetch(`${base}/api/products`);
          if (!initial.ok) throw new Error(`Product list failed: ${initial.status}`);
          const initialPayload = await initial.json();
          if (beijingDay(initialPayload.lark?.lastSyncedAt ?? 0) !== today) {
            const lark = await fetch(`${base}/api/lark/sync`, { method: 'POST' });
            if (!lark.ok) console.warn(`Lark cost sync skipped: ${lark.status} ${await lark.text()}`);
          }
          const selected = await fetch(`${base}/api/collections`);
          if (!selected.ok) throw new Error(`Collection list failed: ${selected.status}`);
          const { collections = [] } = await selected.json();
          if ((initialPayload.products ?? []).length &&
              initialPayload.products.every((product) => !staleCountries(product).length) &&
              beijingDay(initialPayload.lark?.lastSyncedAt ?? 0) === today &&
              collections.every((collection) => beijingDay(collection.updatedAt) === today)) {
            console.log(`Products, Lark costs and collections are current for ${today}; skipped.`);
            process.exit(0);
          }
          for (const collection of collections) {
            if (beijingDay(collection.updatedAt) === today) continue;
            const response = await fetch(`${base}/api/collections`, {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ handle: collection.handle }),
            });
            if (!response.ok) { console.error(`Collection ${collection.handle} failed: ${await response.text()}`); continue; }
            const { collection: current } = await response.json();
            for (let offset = 0; offset < current.productHandles.length; offset += 8) {
              const imported = await fetch(`${base}/api/collections/import`, {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ handle: current.handle, offset }),
              });
              const result = await imported.json().catch(() => ({}));
              if (!imported.ok || result.failedHandles?.length) console.error(`Collection ${current.handle} batch ${offset} needs review: ${JSON.stringify(result)}`);
            }
          }
          const response = await fetch(`${base}/api/products`);
          if (!response.ok) throw new Error(`Product list failed: ${response.status}`);
          const { products = [] } = await response.json();
          const beijingTime = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
          }).format(new Date());
          const [hour, minute] = beijingTime.split(':').map(Number);
          const slot = Math.max(0, Math.floor((hour * 60 + minute - 8 * 60) / 10));
          const start = products.length ? (slot * 8) % products.length : 0;
          const pending = [];
          for (let offset = 0; offset < products.length && pending.length < 8; offset += 1) {
            const product = products[(start + offset) % products.length];
            const missing = staleCountries(product);
            if (missing.length) pending.push({ product, missing });
          }
          for (const [index, { product, missing }] of pending.entries()) {
            const results = await Promise.all(missing.map((country) => fetch(`${base}/api/refresh`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ ids: [product.id], country, source: 'auto' }),
              })));
            for (const [countryIndex, refresh] of results.entries()) {
              const payload = await refresh.json().catch(() => ({}));
              if (!refresh.ok || payload.errors?.length) console.error(`Product ${index + 1} ${missing[countryIndex]} failed: ${JSON.stringify(payload.errors ?? refresh.status)}`);
            }
          }
          console.log(`Processed ${pending.length} of ${products.length} products for ${today}; no more than eight in this run.`);
          NODE
